# =====================================================================
#  კონფიგურაციის ფაილი  (დავალების მე-6 პუნქტი: "გამოიყენეთ configuration reader")
# ---------------------------------------------------------------------
#  აქ ინახება ყველა პარამეტრი, რომელიც შეიძლება შეიცვალოს.
#  კოდში არსად წერია "https://..." ან "chrome" — ყველაფერი აქედან იკითხება.
#  თუ გინდა ტესტები Firefox-ზე გაუშვა — უბრალოდ browser=firefox დაწერე.
# =====================================================================


# ---------- ბრაუზერი ----------
# შესაძლო მნიშვნელობები: chrome | firefox | edge
browser=chrome

# headless=true  ->  ბრაუზერი არ გამოჩნდება ეკრანზე (სწრაფია, CI-სთვის)
# headless=false ->  ბრაუზერს დაინახავ და ნახავ რას აკეთებს ტესტი
headless=false

# ბრაუზერის ფანჯარა მაქსიმალურ ზომაზე გაიხსნას
maximize=true

# --- დრაივერის ხელით მითითება (არასავალდებულო) ---
# ჩვეულებრივ ცარიელი უნდა იყოს — მაშინ დრაივერი ავტომატურად ჩამოიტვირთება
# (WebDriverManager ან Selenium Manager).
#
# შეავსე მხოლოდ მაშინ, თუ შენი ქსელი ბლოკავს დრაივერების ჩამოტვირთვას
# (ოფისი, უნივერსიტეტი). მაშინ chromedriver.exe ხელით ჩამოტვირთე
# https://googlechromelabs.github.io/chrome-for-testing/ საიტიდან
# და აქ სრული გზა მიუთითე, მაგალითად:
#   driver.path=C:/WebDriver/chromedriver.exe
driver.path=


# ---------- ლოდინის დროები (წამებში) ----------
# Implicit wait — Selenium ყოველ ელემენტს ამდენ ხანს დაელოდება
implicit.wait=5
# Explicit wait — WebDriverWait-ის მაქსიმალური ლოდინი
explicit.wait=15
# Fluent wait — მთლიანი ლოდინი და შემოწმების ინტერვალი
fluent.wait.timeout=20
fluent.wait.polling=1
# გვერდის ჩატვირთვის ლიმიტი
page.load.timeout=40


# ---------- ვებ საიტის მისამართები ----------
# პორტალი — აქ არის ენების <select> dropdown
portal.url=https://www.wikipedia.org
# ინგლისური ვიკიპედია
wiki.url=https://en.wikipedia.org
# ლოგინის გვერდი (ყურადღება: რედირექტი ხდება auth.wikimedia.org-ზე)
login.url=https://en.wikipedia.org/wiki/Special:UserLogin
# რეგისტრაციის გვერდი
register.url=https://en.wikipedia.org/wiki/Special:CreateAccount
# დომენი, რომელზეც ავტორიზაცია ხდება (assert-ისთვის)
auth.domain=auth.wikimedia.org


# ---------- სატესტო მონაცემები (ლოგინისთვის) ----------
# ეს მომხმარებელი განზრახ არ არსებობს — ნეგატიური ტესტისთვის გვჭირდება
invalid.username=QaAutomationNoSuchUser99887
invalid.password=definitely-not-a-real-password
# მოსალოდნელი შეცდომის ტექსტი
login.error.message=Incorrect username or password entered.

# --- პოზიტიური ლოგინი (არასავალდებულო) ---
# თუ გაქვს რეალური ვიკიპედიის ანგარიში და გინდა პოზიტიური ლოგინის ტესტიც გაეშვას,
# შეავსე ქვემოთა ორი ველი. თუ ცარიელი დატოვე — ტესტი უბრალოდ გამოტოვდება
# (SKIPPED), ჩავარდნის ნაცვლად.
#
# ⚠️ ყურადღება: ეს ფაილი GitHub-ზე აიტვირთება! თუ რეალურ პაროლს ჩაწერ,
#    ის საჯარო გახდება. უსაფრთხოდ რომ იმუშაო — ჩაწერე მხოლოდ ლოკალურად
#    და commit-ის წინ დააბრუნე ცარიელად.
valid.username=
valid.password=


# ---------- API კონფიგურაცია (მე-8 პუნქტი) ----------
# restful-booker — უფასო სატესტო API, რომელსაც აქვს ტოკენით ავტორიზაცია
api.base.url=https://restful-booker.herokuapp.com
api.auth.path=/auth
api.booking.path=/booking
api.username=admin
api.password=password123
# API-ს პასუხის მაქსიმალური დრო (მილიწამებში) — Heroku ზოგჯერ ნელია
api.timeout.ms=30000
